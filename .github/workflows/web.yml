name: Web App CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/web/**'
      - 'packages/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install dependencies
      run: npm ci --include=optional
    
    - name: Type check
      working-directory: apps/web
      run: npm run type-check

    - name: Lint
      working-directory: apps/web
      run: npm run lint

    - name: Test
      working-directory: apps/web
      run: npm run test

    - name: Build
      working-directory: apps/web
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        NEXT_PUBLIC_AUTH_BYPASS: 'false'
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Isolated local stack (Postgres + Auth), not the shared remote
      # project — the auth-bypass user only exists here (seeded by
      # supabase/migrations/20260224_zz_dev_user.sql), and property.user_id
      # FKs to a real auth.users row so the bypass user can't own data on
      # the remote project at all.
      - name: Start local Supabase stack
        working-directory: supabase
        run: supabase start

      - name: Export local Supabase connection details
        working-directory: supabase
        run: supabase status -o env >> "$GITHUB_ENV"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # NEXT_PUBLIC_* vars are baked in at build time, so this job builds
      # fresh against the local stack rather than reusing build-and-test's
      # artifact (which is built against the real project's public keys).
      - name: Build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          NEXT_PUBLIC_AUTH_BYPASS: 'true'
          DATABASE_URL: ${{ env.DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}

      - name: Run e2e smoke suite
        working-directory: apps/web
        run: npm run test:e2e
        env:
          DATABASE_URL: ${{ env.DB_URL }}
          NEXT_PUBLIC_AUTH_BYPASS: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  performance-smoke:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run performance smoke test
        working-directory: apps/web
        run: npm run test -- --run src/lib/performanceSmoke.test.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
